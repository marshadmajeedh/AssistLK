name: AssistLK CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. ASP.NET Core Backend (Mandatory / Blocking)
  # =========================================================================
  backend:
    name: Backend (.NET 8 & PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore backend/AssistLK.sln

      - name: Build backend (Release)
        run: dotnet build backend/AssistLK.sln --configuration Release --no-restore

      - name: Run unit tests (AssistLK.Api.Tests)
        run: dotnet test backend/tests/AssistLK.Api.Tests/AssistLK.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Run integration tests (AssistLK.IntegrationTests)
        env:
          ASSISTLK_TEST_POSTGRESQL_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test backend/tests/AssistLK.IntegrationTests/AssistLK.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  # =========================================================================
  # 2. C1 Python Agentic AI Service (Encouraged / Blocking)
  # =========================================================================
  agent-ai:
    name: Agentic AI (Problem Understanding)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agent-services/problem-understanding-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent-services/problem-understanding-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest (Offline simulation)
        run: pytest

  # =========================================================================
  # 3. React Web Application (Encouraged / Partially Blocking)
  # =========================================================================
  web:
    name: Web (React / Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Temporarily advisory pending teammate-owned C2 provider lint cleanup (6 ESLint errors in src/features/providers/).
      # Do not suppress ESLint rules or hide failures; continue-on-error visibly surfaces genuine errors without breaking the group build.
      - name: Run linter (Advisory - pending C2 provider cleanup)
        continue-on-error: true
        run: npm run lint

  # =========================================================================
  # 4. Flutter Mobile Application (Encouraged / Temporarily Advisory)
  # =========================================================================
  # Temporarily advisory pending repair of teammate-owned C2 mobile regressions:
  # 1) ProviderRegistrationScreen test references undefined initialStep parameter.
  # 2) ProviderHomeScreen tests suffer from pumpAndSettle animation/timer timeouts.
  # Configured with continue-on-error: true so real failures remain fully visible on GitHub Actions without blocking CI.
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run widget and unit tests
        run: flutter test
