[project]
name = "provider-matching-agent"
version = "1.0.0"
description = "AssistLK Component 2 - Provider Matching and Recommendation Agent Microservice"
authors = [{ name = "AssistLK Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
